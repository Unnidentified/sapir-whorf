<!DOCTYPE html>
<html lang="{{__locale_id}}" dir="{{__locale_direction}}" class="title-{{title_font}}" style="zoom: {{page_scale}}%">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
        <title>
            Sapir-Whorf - History
        </title>
        <link rel="stylesheet" href="static/main.css">
        <link rel="stylesheet" href="static/themes/{{theme}}.css">
        {{if theme == "custom"}}
        <style>
            :root {
                --bg-main: {{custom_bg_main}};
                --bg-card: {{custom_bg_card}};
                --border: {{custom_border}};
                --text-primary: {{custom_text_primary}};
                --text-secondary: {{custom_text_secondary}};
                --text-muted: {{custom_text_muted}};
                --accent: {{custom_accent}};
                --accent-glow: {{custom_accent_glow}};
                --text-dim: {{custom_text_dim}};
            }
        </style>
        {{endif}}
        <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
        <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
        <link rel="search" 
        type="application/opensearchdescription+xml" 
        title="Sapir-Whorf" href="/opensearch.xml">
    </head>
    
    <body class="results-view">
        {{include "_chrome.html"}}
        <div class="content-layout">
            <aside class="sidebar-spacer">
            </aside>
            <main class="results-container">
                <div class="history-head">
                    <h2 class="history-title">Search history</h2>
                    <div class="history-tools">
                        <label class="history-autodelete-label" for="history-autodelete">Auto-delete</label>
                        <select id="history-autodelete" class="history-autodelete">
                            <option value="0">Never</option>
                            <option value="1">After 1 day</option>
                            <option value="7">After 7 days</option>
                            <option value="30">After 30 days</option>
                        </select>
                        <button type="button" id="history-clear" class="history-clear">Clear history</button>
                    </div>
                </div>
                <p id="history-empty" class="history-empty" hidden>
                    No searches recorded yet.
                </p>
                <ol id="history-list" class="history-list"></ol>
            </main>
        </div>
        <script src="/static/autocomplete.js" defer></script>
        <script src="/static/history.js" defer></script>
    </body>

</html>
