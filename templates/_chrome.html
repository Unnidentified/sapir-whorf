<header>
    <a href="/" class="logo-link"><h1>
        <span class="prompt">&gt;</span> sapir<span class="tail">-whorf</span>
    </h1></a>
    <form action="{{chrome_action}}" method="GET" class="search-form">
        {{if chrome_engine != ""}}<input name="engine" type="hidden" value="{{chrome_engine}}">{{endif}}
        <input name="q" type="text" class="search-box" autocomplete="off" placeholder="{{l("search_placeholder")}}"
        value="{{query}}">
    </form>
    <a href="/settings?q={{query}}" class="nav-settings-icon" title="{{l("settings_tab")}}"></a>
</header>
<nav class="nav-tabs">
    <div class="nav-container">
        <a href="{{chrome_all_href}}" {{if chrome_active == "all"}}class="active"{{endif}}>
            {{l("all_tab")}}
        </a>
        <a href="/images?q={{query}}" {{if chrome_active == "images"}}class="active"{{endif}}>
            {{l("images_tab")}}
        </a>
        <a href="/settings?q={{query}}" class="nav-settings-link">
            {{l("settings_tab")}}
        </a>
    </div>
</nav>
