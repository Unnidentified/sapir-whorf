[server]
# Answer box: all | local | off. "local" answers arithmetic, units, colour,
# time zones, date maths and random on this server; "all" also sends the query
# to Wikipedia and the dictionary/currency lookups; "off" hides the box.
#answers = local

# What happens to the engine fan-out when a local answer is certain:
#   always - show results under every answer, as Google does (default)
#   auto   - skip the search only for a certain, wordless answer ("2+2")
#   never  - a certain answer is the whole page (the previous behaviour)
# Per-user override: the Answers section of /settings, stored in a cookie.
#answers_fanout = always
host = 0.0.0.0
port = 8087

# Default locale (default: en_gb)
#locale = en_gb

[proxy]
# Single proxy (comment out to use list_file instead)
#proxy = "socks5://127.0.0.1:9050"

# Or use a proxy list file (one proxy per line)
#list_file = proxies.txt

#max_retries = 3

# Randomize proxy credentials for each request
#randomize_username = true
#randomize_password = true

[cache]
# Directory to store cached responses
#dir = /tmp/omnisearch_cache

# Cache TTL for search results in seconds (default: 3600 = 1 hour)
#ttl_search = 3600

# Cache TTL for infobox data in seconds (default: 86400 = 24 hours)
#ttl_infobox = 86400

[engines]
# SearXNG bridge - the documented, lower-risk route to Google's index and to
# indexes we do not scrape ourselves. One command:
#   docker run -d --name searxng -p 8888:8080 searxng/searxng
# then set searxng_url and add searxng to the engines list.
#searxng_url = http://127.0.0.1:8888
#searxng_engines = google,brave,qwant

# Google, two ways, neither of them free-range:
#
#   google_cse_element uses the Programmable Search *Element* endpoint. It is
#   clean-room, disabled by default, and experimental: it uses a third-party CX
#   through an undocumented endpoint. Only google_cse_cx is required - the
#   token is fetched automatically and cached for an hour. google_cse_tok is an
#   optional override for when that endpoint changes. See docs/G3-google-cse.md.
#google_cse_cx  =
#google_cse_tok =
#
#   google_cse_key/cx is the JSON API. It still works for keys issued before
#   2026-01, and the service ends 2027-01-01.
#google_cse_key =
# Use * for all engines, or specify comma-separated list (e.g., ddg,yahoo)
# Use *,-engine to exclude specific engines (e.g., *,-startpage)
# Available engines: ddg, startpage, yahoo, mojeek, yacy
engines="*"
# YaCy instance to use for the yacy engine (optional, default: http://127.0.0.1:8090)
# Requires "yacy" to be in the engines list above.
#yacy_instance = http://127.0.0.1:8090

[rate_limit]
# Rate limit searches per interval

# /search
#search_requests = 10
#search_interval = 60

# /images
#images_requests = 20
#images_interval = 60

[health]
# Breaker: engines that keep failing are skipped for cooldown_seconds.
# The key is breaker_threshold - "threshold" is not a key and is rejected.
#breaker_threshold = 3
#cooldown_seconds = 900
#
# Outbound pacing, per engine. The cooldown above is what happens after an
# engine says no; this is what stops us making it say no.
#pace_requests_per_minute = 40
#pace_burst = 6

# The authority tiers, the spam list and the public-suffix list are read from
# static/authority.tsv, static/spam_hosts.txt and static/public_suffixes.txt.
# There is no config key for them: they are data files, edited directly.
